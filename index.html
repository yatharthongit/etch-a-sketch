<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button>Reset Grid</button>

    <div class="checkboxes">
    <label><input type="radio" class="None" name="check" checked="checked">Black</label>
    <label><input type="radio" class="checkbox" name="check">Random Color</label>
    <label><input type="radio" class="shading" name="check">Shading</label>
    <label><input type="radio" class="eraser" name="check">Erase</label>
    </div>
    
    <div class="container"></div>
</body>
</html>
